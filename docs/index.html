<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #080c16;
    font-family: "Noto Sans CJK TC", "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
    color: #f1f5f9;
    width: 760px;
  }
  .mono {
    font-family: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", "SFMono-Regular", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  #brief-card {
    background: #0a0f1d;
    padding: 24px;
    width: 760px;
  }
  .shell {
    background: #101726;
    border: 1px solid #1e293b;
    border-radius: 20px;
    padding: 26px 26px 22px;
  }

  /* Header */
  .header-pills {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .pill-group { display: flex; gap: 8px; align-items: center; }
  .pill {
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
    background: #1a2335; color: #cbd5e1; border: 1px solid #2b384f;
  }
  .pill.deep {
    background: #2b1d0e; color: #fbbf24; border-color: #78350f;
  }
  .pill.regime {
    background: #0f2538; color: #38bdf8; border-color: #1e496b;
  }
  .main-title {
    font-size: 27px; font-weight: 800; letter-spacing: 0.4px; color: #ffffff;
    line-height: 1.25;
  }
  .sub-meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; font-size: 13px; color: #94a3b8;
    padding-bottom: 20px; border-bottom: 1px solid #1e293b;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #10b981; flex-shrink: 0;
  }

  /* Section Titles */
  .sec-head {
    display: flex; justify-content: space-between; align-items: center;
    margin: 24px 0 12px;
  }
  .sec-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 800; color: #ffffff; letter-spacing: 0.3px;
  }
  .sec-bar {
    width: 4px; height: 18px; border-radius: 99px; background: #e2e8f0; display: inline-block;
  }
  .sec-bar.amber { background: #f59e0b; }
  .sec-right { font-size: 12px; color: #64748b; }

  /* Grids & Cards */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  .card {
    background: #151e30; border: 1px solid #233046;
    border-radius: 14px; padding: 15px 17px;
  }
  .card.extreme-down {
    background: linear-gradient(145deg, #102422 0%, #151e30 70%);
    border-color: #10b98188;
  }
  .card.extreme-up {
    background: linear-gradient(145deg, #2b141c 0%, #151e30 70%);
    border-color: #f43f5e88;
  }
  .card.alert-amber {
    background: linear-gradient(180deg, #1c1814 0%, #161414 100%);
    border-color: #92400e;
  }

  /* US 2x2 */
  .idx-top {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
  }
  .idx-name { font-size: 13.5px; color: #94a3b8; font-weight: 600; }
  .move-tag {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
  }
  .move-tag.up { background: #3b1721; color: #fb7185; }
  .move-tag.down { background: #0e2e26; color: #34d399; }
  .move-tag.flat { background: #1e293b; color: #94a3b8; }

  .idx-val { font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }
  .idx-chg { font-size: 14px; font-weight: 700; margin-top: 6px; }
  .idx-pts { font-size: 12.5px; font-weight: 500; opacity: 0.85; margin-left: 4px; }

  /* Colors (紅漲綠跌) */
  .up { color: #fb7185; }
  .down { color: #34d399; }
  .flat { color: #94a3b8; }

  /* Barometer */
  .baro-card {
    display: flex; justify-content: space-between; align-items: center;
    background: #131c2e; border: 1px solid #223047;
    border-radius: 14px; padding: 12px 16px;
  }
  .baro-left { display: flex; align-items: center; gap: 11px; }
  .ticker-badge {
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    font-size: 11px; font-weight: 800; padding: 6px 8px; border-radius: 8px;
    min-width: 46px; text-align: center;
  }
  .baro-sub { font-size: 11px; color: #94a3b8; }
  .baro-name { font-size: 14px; font-weight: 700; color: #f8fafc; margin-top: 2px; }
  .baro-chg { font-size: 16px; font-weight: 700; }

  /* Macro 3-col */
  .macro-top {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
  }
  .macro-name { font-size: 12.5px; color: #94a3b8; }
  .macro-val { font-size: 20px; font-weight: 700; color: #f8fafc; }
  .macro-sub { font-size: 11.5px; color: #64748b; margin-top: 4px; }

  /* News Cards */
  .news-card {
    background: #141d2e; border: 1px solid #233046;
    border-radius: 14px; padding: 15px 17px; margin-bottom: 10px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .news-tag {
    background: #1e293b; border: 1px solid #334155; color: #cbd5e1;
    font-size: 11.5px; font-weight: 800; padding: 6px 0; border-radius: 8px;
    width: 48px; text-align: center; flex-shrink: 0; margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .news-body { flex: 1; min-width: 0; }
  .news-top {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .news-title { font-size: 15.5px; font-weight: 800; color: #ffffff; line-height: 1.4; }
  .news-src {
    font-size: 11px; color: #94a3b8; background: #0f172a;
    border: 1px solid #2b384f; padding: 2px 8px; border-radius: 6px; white-space: nowrap;
  }
  .news-fact { font-size: 13px; color: #cbd5e1; line-height: 1.55; margin-top: 6px; }
  .news-impact-row {
    display: flex; align-items: flex-start; gap: 9px;
    margin-top: 9px; padding-top: 9px; border-top: 1px dashed #243248;
  }
  .impact-pill {
    background: #33230f; color: #fbbf24; border: 1px solid #78350f;
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    white-space: nowrap; margin-top: 1px;
  }
  .impact-text { font-size: 13px; color: #e2e8f0; line-height: 1.5; }

  /* Taiwan Premarket */

    display: flex; justify-content: space-between; align-items: center;
    background: #131c2e; border: 1px solid #223047;
    border-radius: 14px; padding: 15px 18px;

    border-color: #10b98166;
  }
  .tw-top-card.extreme-up {

    border-color: #f43f5e66;

  .tw-unit { font-size: 13px; color: #94a3b8; font-weight: 500; margin-left: 3px; }
  .chg-pill {
    font-size: 13.5px; font-weight: 700; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap;

  .chg-pill.up { background: #3b1721; color: #fb7185; border: 1px solid #f43f5e44; }
  .chg-pill.down { background: #0e2e26; color: #34d399; border: 1px solid #10b98144; }
  .chg-pill.flat { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

  .spot-headline { font-size: 18px; font-weight: 800; margin: 6px 0 10px; line-height: 1.3; }
  .spot-pills { display: flex; flex-direction: column; gap: 6px; }
  .spot-pill {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 7px;
  }
  .spot-pill.up { background: #361721; color: #fda4af; }
  .spot-pill.down { background: #0e2b24; color: #6ee7b7; }
  .spot-pill.flat { background: #1e293b; color: #94a3b8; }

  .oi-head { display: flex; justify-content: space-between; align-items: center; }
  .alert-badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    background: #3d240c; color: #fbbf24; border: 1px solid #92400e;
  }
  .oi-val { font-size: 23px; font-weight: 700; color: #ffffff; margin: 10px 0 12px; }
  .oi-note { font-size: 12px; color: #fbbf24; line-height: 1.45; }
  .oi-note.normal { color: #94a3b8; }

  .focus-bar {
    margin-top: 12px; background: #151e30; border: 1px solid #243248;
    border-radius: 12px; padding: 12px 16px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .focus-pill {
    background: #243248; color: #e2e8f0; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 7px; white-space: nowrap; margin-top: 1px;
  }
  .focus-text { font-size: 13.5px; color: #e2e8f0; line-height: 1.55; }

  /* Timeline Calendar */
  .cal-card {
    margin-top: 20px; background: #141d2e; border: 1px solid #233046;
    border-radius: 16px; padding: 18px 20px;
  }
  .timeline { margin-top: 14px; position: relative; padding-left: 22px; }
  .timeline::before {
    content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px;
    width: 2px; background: #26344b;
  }
  .tl-item { position: relative; margin-bottom: 14px; }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-dot {
    position: absolute; left: -22px; top: 4px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #475569; border: 2px solid #141d2e;
  }
  .tl-dot.today { background: #f43f5e; box-shadow: 0 0 0 3px #f43f5e33; }
  .tl-time { font-size: 12.5px; font-weight: 700; color: #94a3b8; }

  .tl-title { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-top: 2px; line-height: 1.45; }

  /* Blindspots */
  .blind-wrap {
    margin-top: 16px; background: #171412; border: 1px solid #78350f;
    border-radius: 16px; padding: 18px 20px;
  }
  .blind-card {
    background: #141824; border: 1px solid #2b2725;
    border-radius: 12px; padding: 13px 15px; margin-top: 10px;
  }
  .blind-head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .blind-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: #f59e0b; color: #111827; font-size: 12px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .blind-title { font-size: 14.5px; font-weight: 800; color: #ffffff; }
  .blind-detail { font-size: 13px; color: #cbd5e1; line-height: 1.55; padding-left: 29px; }

  .footer {
    margin-top: 18px; text-align: center; font-size: 11.5px; color: #64748b;
  }
</style>
</head>

      ${(d.top_news || []).map((n, idx) => `
        <div class="news-card">
          <div class="news-tag mono">${n.tag || ('0' + (idx + 1))}</div>
          <div class="news-body">
            <div class="news-top">
              <div class="news-title">${n.title}</div>
              <div class="news-src">${n.source}</div>
            </div>
            <div class="news-fact">${n.fact}</div>
            <div class="news-impact-row">
              <span class="impact-pill">影響板塊</span>
              <span class="impact-text">${n.impact}</span>
            </div>
          </div>
        </div>
      `).join('')}

      <div class="sec-head">
        <div class="sec-title"><span class="sec-bar"></span>台股盤前風向</div>
        <div class="sec-right">${d.tw_date} 盤後與夜盤</div>
      </div>

      <div class="grid-2">
        <div class="tw-top-card ${extremeClass(d.tw_night)}">
          <div>
            <div class="idx-name">台指期夜盤</div>
            <div class="tw-big-val mono">${d.tw_night.value}<span class="tw-unit">${d.tw_night.unit}</span></div>
          </div>
          <div class="chg-pill mono ${d.tw_night.trend}">${arrow(d.tw_night.trend)}${d.tw_night.badge}</div>
        </div>
        <div class="tw-top-card ${extremeClass(d.tw_index)}">
          <div>
            <div class="idx-name">台灣加權指數 (${d.tw_index.date})</div>
            <div class="tw-big-val mono">${d.tw_index.value}</div>
          </div>
          <div class="chg-pill mono ${d.tw_index.trend}">${arrow(d.tw_index.trend)}${d.tw_index.change}</div>
        </div>
      </div>

      <div class="grid-3" style="margin-top:12px;">
        <div class="card">
          <div class="idx-name">三大法人現貨 (${d.tw_spot.date})</div>
          <div class="spot-headline ${d.tw_spot.trend}">${d.tw_spot.headline}</div>
          <div class="spot-pills">
            ${spotBreakdown.map(b => `
              <div class="spot-pill ${b.trend}">
                <span>${b.label}</span>
                <span class="mono">${arrow(b.trend)}${b.value}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="card ${d.tw_oi.is_alert ? 'alert-amber' : ''}">
          <div class="oi-head">
            <div class="idx-name">${d.tw_oi.title}</div>
            <div class="alert-badge">${d.tw_oi.badge}</div>
          </div>
          <div class="oi-val mono">${d.tw_oi.value}<span class="tw-unit">${d.tw_oi.unit}</span></div>
          <div class="oi-note ${d.tw_oi.is_alert ? '' : 'normal'}">${d.tw_oi.note}</div>
        </div>

        <div class="card">
          <div class="oi-head">
            <div class="idx-name">亞股參考・日經 225</div>
            <div class="move-tag ${d.nikkei.trend}">${d.nikkei.status}</div>
          </div>
          <div class="oi-val mono">${d.nikkei.value}</div>
          <div class="idx-chg mono ${d.nikkei.trend}" style="margin-top:0;">${arrow(d.nikkei.trend)}${d.nikkei.change}</div>
          <div class="macro-sub" style="margin-top:6px;">資料日 ${d.nikkei.date}</div>
        </div>
      </div>

      <div class="focus-bar">
        <span class="focus-pill">盤前焦點</span>
        <div class="focus-text">${d.premarket_focus}</div>
      </div>

      <div class="cal-card">
        <div class="sec-title"><span class="sec-bar"></span>關鍵行事曆（台北時間）</div>
        <div class="timeline">
          ${calEvents.map(ev => `
            <div class="tl-item">
              <div class="tl-dot ${ev.is_today ? 'today' : ''}"></div>
              <div class="tl-time mono ${ev.is_today ? 'today' : ''}">${ev.time_label}</div>
              <div class="tl-title">${ev.title}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="blind-wrap">
        <div class="sec-title" style="color:#fbbf24;"><span class="sec-bar amber"></span>盲點與反面視角</div>
        ${blindspots.map((b, idx) => `
          <div class="blind-card">
            <div class="blind-head">
              <span class="blind-num mono">${idx + 1}</span>
              <span class="blind-title">${b.title}</span>
            </div>
            <div class="blind-detail">${b.detail}</div>
          </div>
        `).join('')}
      </div>

      <div class="footer">客觀中立財經主編視角 ・ 零幻覺時間基準核對 ・ 不構成個人投資建議</div>
    </div>
  `;
</script>
</body>
</html>
