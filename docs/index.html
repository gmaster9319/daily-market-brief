<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0f19;
    font-family: "Noto Sans CJK TC", "Noto Sans TC", "PingFang TC", sans-serif;
    color: #f1f5f9;
    width: 680px;
  }
  #brief-card {
    background: linear-gradient(180deg, #0f172a 0%, #0b0f19 100%);
    padding: 28px;
    width: 680px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid #1e293b; padding-bottom: 14px; margin-bottom: 14px;
  }
  .title { font-size: 25px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; }
  .subtitle { font-size: 12.5px; color: #94a3b8; margin-top: 4px; }
  .badges { display: flex; gap: 8px; }
  .badge {
    background: #1e293b; color: #38bdf8; border: 1px solid #38bdf855;
    padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
  }
  .badge.deep { background: #451a03; color: #fb923c; border-color: #fb923c66; }

  .summary-bar {
    background: #132038; border: 1px solid #1e3a5f; border-radius: 12px;
    padding: 12px 16px; margin-bottom: 14px; font-size: 14px; line-height: 1.55; color: #e2e8f0;
  }
  .regime-pill {
    display: inline-block; background: #0284c7; color: #ffffff;
    font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 8px;
  }

  .section-title {
    font-size: 13px; font-weight: 700; color: #94a3b8;
    letter-spacing: 1px; margin: 16px 0 9px;
  }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
  .box {
    background: #151e32; border: 1px solid #1e293b;
    border-radius: 12px; padding: 11px 12px;
  }
  .chip-box {
    background: #141c2f; border: 1px solid #26344d;
    border-radius: 12px; padding: 12px 13px;
  }
  .box-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  .box-val { font-size: 16.5px; font-weight: 700; color: #f8fafc; }
  .box-chg { font-size: 13.5px; font-weight: 700; margin-top: 2px; }
  .box-sub { font-size: 11.5px; color: #94a3b8; margin-top: 4px; }

  /* 台股習慣：紅漲綠跌 */
  .up { color: #f87171; }
  .down { color: #34d399; }
  .flat { color: #94a3b8; }

  .barometer {
    display: flex; justify-content: space-between; align-items: center;
    background: #151e32; border: 1px solid #1e293b; border-radius: 12px;
    padding: 10px 16px; margin-top: 10px; font-size: 13.5px;
  }
  .news-item {
    background: #151e32; border-left: 4px solid #38bdf8;
    border-radius: 0 12px 12px 0; padding: 11px 14px; margin-bottom: 9px;
  }
  .news-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 5px; }
  .news-title { font-size: 14.5px; font-weight: 700; color: #ffffff; }
  .news-src {
    font-size: 11px; color: #94a3b8; background: #0f172a;
    border: 1px solid #334155; padding: 2px 7px; border-radius: 6px; white-space: nowrap;
  }
  .news-text { font-size: 13px; color: #cbd5e1; line-height: 1.55; margin-bottom: 4px; }
  .news-impact { font-size: 12.5px; color: #7dd3fc; line-height: 1.5; }

  .radar-box {
    background: #1c1917; border: 1px solid #78350f; border-radius: 12px;
    padding: 13px 15px; margin-top: 12px;
  }
  .radar-title { font-size: 13.5px; font-weight: 700; color: #fbbf24; margin-bottom: 6px; }
  .radar-text { font-size: 13px; color: #fde68a; line-height: 1.55; }
  .footer {
    margin-top: 14px; text-align: right; font-size: 11px; color: #64748b;
  }
</style>
</head>
<body>
<div id="brief-card"></div>

<script>
  const d = {"title_date": "2026/11/26 (四)", "mode_label": "常態盤前・精簡版", "is_deep": false, "data_basis": "美股 11/25 收盤 ＆ 台股 11/26 盤後／夜盤", "tw_date": "11/26", "regime_tag": "高波動分化盤", "premarket_focus": "昨夜美股道瓊逆轉收紅、費半收跌且VIX升至28.29；今美股休市，關注301關稅與台股籌碼動向。", "us_indices": [{"name": "道瓊工業", "value": "50,182.95", "change": "+0.33%", "pts": "(+164點)", "status": "小漲", "trend": "up", "is_extreme": false, "pct_num": 0.3283771920610628, "date": "11/25"}, {"name": "S&P 500", "value": "7,182.78", "change": "-0.25%", "pts": "", "status": "小跌", "trend": "down", "is_extreme": false, "pct_num": 0.2542678815435381, "date": "11/25"}, {"name": "那斯達克", "value": "23,585.80", "change": "-0.62%", "pts": "", "status": "小跌", "trend": "down", "is_extreme": false, "pct_num": 0.6224791327410149, "date": "11/25"}, {"name": "費城半導體", "value": "8,774.86", "change": "-0.65%", "pts": "(-58點)", "status": "小跌", "trend": "down", "is_extreme": false, "pct_num": 0.6525637737050666, "date": "11/25"}], "barometer": {"tsm": {"name": "台積電 ADR (TSM)", "value": "休市", "change": "前收 11/24", "pts": "", "status": "休市", "trend": "flat", "is_extreme": false, "pct_num": 0.0, "date": "11/24"}, "nvda": {"name": "輝達 (NVDA)", "value": "休市", "change": "前收 11/24", "pts": "", "status": "休市", "trend": "flat", "is_extreme": false, "pct_num": 0.0, "date": "11/24"}}, "macro": [{"name": "10Y 美債殖利率", "value": "4.85%", "change": "-5.6 bps", "pts": "", "status": "走弱", "trend": "down", "is_extreme": false, "pct_num": 1.1419200261210316, "date": "11/25"}, {"name": "美元指數 (DXY)", "value": "103.74", "change": "-0.07%", "pts": "", "status": "小跌", "trend": "down", "is_extreme": false, "pct_num": 0.07128166775731513, "date": "11/25"}, {"name": "VIX 恐慌指數", "value": "28.29", "change": "+7.32%", "pts": "", "status": "大漲", "trend": "up", "is_extreme": true, "pct_num": 7.3217005329577685, "date": "11/25"}], "tw_night": {"value": "休市／待開盤", "unit": "", "badge": "暫無夜盤報價", "trend": "flat", "is_extreme": false}, "tw_index": {"name": "台灣加權指數", "value": "39,132.22", "change": "-2.47%", "pts": "(-990點)", "status": "走弱", "trend": "down", "is_extreme": false, "pct_num": 2.4677836017603187, "date": "11/26"}, "nikkei": {"name": "日經 225", "value": "58,128.00", "change": "-0.88%", "pts": "", "status": "小跌", "trend": "down", "is_extreme": false, "pct_num": 0.8809483764930786, "date": "11/26"}, "tw_spot": {"headline": "合計賣超 814.5 億", "trend": "down", "date": "11/25", "breakdown": [{"label": "外資", "value": "-1236.5億", "trend": "down"}, {"label": "投信", "value": "+550.3億", "trend": "up"}, {"label": "自營商", "value": "-128.3億", "trend": "down"}]}, "tw_oi": {"title": "外資台指期未平倉", "value": "暫無", "unit": "", "badge": "待更新", "is_alert": false, "note": "期交所連線逾時", "raw_net": 0}, "top_news": [{"tag": "MACRO", "source": "鉅亨網、Yahoo股市", "title": "美301關稅對台15%且晶片暫豁免", "fact": "美提出14國301產能過剩關稅，對台15%不疊加、越南最高35%，晶片與iPhone暫列豁免。", "impact": "緩解台積電與輝達關稅衝擊，但越南設廠之消費電子與AirPods供應鏈面臨關稅壓力。"}, {"tag": "SEMI", "source": "經濟日報、鉅亨網", "title": "AI賣壓湧現 美股震盪後道瓊逆轉收紅", "fact": "通膨與AI成本疑慮致費半盤中跌7.3%、輝達跌近9%，尾盤買盤進駐使道瓊收漲0.33%、費半跌0.65%。", "impact": "AI晶片與記憶體波動加劇，輝達收跌近4%、台積電ADR跌近2%，牽動台股半導體與AI權值股。"}, {"tag": "TW", "source": "Yahoo股市、永豐金證券", "title": "國家隊護盤台積電 資金轉向PCB族群", "fact": "外資賣超1236.5億、融資增近200億；國家隊進場720億並進駐台積電527億，投信買超550.3億。", "impact": "內外資大幅對作下，台積電暫熄火，盤面資金轉往台達電、聯電、力積電及南電、華通等PCB族群。"}], "calendar_events": [{"time_label": "今日 (全日)", "title": "美國感恩節｜美股休市一日", "is_today": true}, {"time_label": "今日 全日", "title": "美國銀行假日", "is_today": true}, {"time_label": "11/27 (五) 02:00 收盤", "title": "美國感恩節翌日｜美股提前休市（半日盤）", "is_today": false}], "blindspots": [{"title": "指數收斂下的高恐慌背離", "detail": "道瓊小漲0.33%且10Y殖利率降至4.85%，但費半續跌且VIX大漲7.32%至28.29，顯示市場避險情緒仍處高檔。"}, {"title": "內外資對作與期貨籌碼缺口", "detail": "外資賣超1236.5億與投信買超550.3億分歧，融資增近200億，且外資台指期未平倉暫無數據可判斷避險動向。"}], "ai_fallback": false};
  const trendIcon = t => t === 'up' ? '▲ ' : (t === 'down' ? '▼ ' : '');
  const isDeep = d.mode && d.mode.includes('深度');
  const calText = (d.calendar_list && d.calendar_list.length > 0)
    ? d.calendar_list.join(' ｜ ')
    : '未來 7 天暫無已登錄之重大總經事件';

  document.getElementById('brief-card').innerHTML = `
    <div class="header">
      <div>
        <div class="title">台美股盤前財經晨報</div>
        <div class="subtitle">${d.date_label} ｜ 資料基準：${d.data_basis}</div>
      </div>
      <div class="badges">
        <div class="badge ${isDeep ? 'deep' : ''}">${d.mode}</div>
      </div>
    </div>

    <div class="summary-bar">
      <span class="regime-pill">${d.regime_tag}</span>${d.one_line_summary}
    </div>

    <div class="section-title">01. 美股與關鍵指標</div>
    <div class="grid-4">
      ${d.us_indices.map(i => `
        <div class="box">
          <div class="box-label">${i.name}</div>
          <div class="box-val">${i.value}</div>
          <div class="box-chg ${i.trend}">${trendIcon(i.trend)}${i.change}</div>
        </div>
      `).join('')}
    </div>

    <div class="barometer">
      <span style="color:#94a3b8;font-weight:700;">開盤氣壓計</span>
      <span>台積電 ADR <strong class="${d.barometer.tsm.trend}">${trendIcon(d.barometer.tsm.trend)}${d.barometer.tsm.change}</strong></span>
      <span>輝達 NVDA <strong class="${d.barometer.nvda.trend}">${trendIcon(d.barometer.nvda.trend)}${d.barometer.nvda.change}</strong></span>
    </div>

    <div class="grid-2">
      ${d.asia.map(a => `
        <div class="box" style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="box-label">${a.name} (${a.date})</div>
            <div class="box-val">${a.value}</div>
          </div>
          <div class="box-chg ${a.trend}" style="font-size:15px;">${trendIcon(a.trend)}${a.change}</div>
        </div>
      `).join('')}
    </div>

    <div class="grid-3">
      ${d.macro.map(m => `
        <div class="box">
          <div class="box-label">${m.name}</div>
          <div class="box-val" style="font-size:15px;">${m.value}</div>
          <div class="box-chg ${m.trend}" style="font-size:12px;">${m.change}</div>
        </div>
      `).join('')}
    </div>

    <div class="section-title">02. 台股盤前籌碼</div>
    <div class="grid-3" style="margin-top:0;">
      ${(d.tw_chips || []).map(c => `
        <div class="chip-box">
          <div class="box-label">${c.label}</div>
          <div class="box-val ${c.trend}" style="font-size:16px;">${c.value}</div>
          <div class="box-sub">${c.sub}</div>
        </div>
      `).join('')}
    </div>

    <div class="section-title">03. 市場主要驅動事件</div>
    ${d.top_news.map(n => `
      <div class="news-item">
        <div class="news-head">
          <div class="news-title">${n.title}</div>
          <div class="news-src">${n.source}</div>
        </div>
        <div class="news-text"><strong>事實：</strong>${n.fact}</div>
        <div class="news-impact"><strong>影響：</strong>${n.impact}</div>
      </div>
    `).join('')}

    <div class="radar-box">
      <div class="radar-title">04. 未來 7 天行事曆與盲點觀察</div>
      <div class="radar-text" style="margin-bottom:6px;"><strong>📅 行事曆：</strong>${calText}</div>
      <div class="radar-text"><strong>⚠️ 盲點：</strong>${d.blindspot}</div>
    </div>

    <div class="footer">Daily Market Brief ｜ 客觀數據與快訊整理，非投資買賣建議</div>
  `;
</script>
</body>
</html>
